<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COCO Keypoint Annotator</title>
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            background: #f0f2f5; 
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .controls { 
            margin-bottom: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            width: 100%;
            justify-content: space-between;
        }
        svg { 
            border: 1px solid #cbd5e1; 
            background: #f8fafc; 
            touch-action: none; 
        }
        .bone { 
            stroke: #3b82f6; 
            stroke-width: 3; 
            stroke-linecap: round; 
        }
        .node { 
            fill: #ef4444; 
            stroke: white; 
            stroke-width: 2; 
            cursor: grab; 
        }
        .node:active { 
            cursor: grabbing; 
        }
        textarea { 
            width: 100%; 
            height: 80px; 
            margin-top: 15px; 
            font-family: monospace; 
            padding: 8px; 
            border: 1px solid #cbd5e1; 
            border-radius: 4px; 
            resize: none; 
            box-sizing: border-box;
        }
        button { 
            padding: 8px 16px; 
            background: #10b981; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { background: #059669; }
        select { 
            padding: 8px; 
            border-radius: 4px; 
            border: 1px solid #cbd5e1; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <select id="poseSelect">
            <option value="standing">Standard Standing</option>
            <option value="tpose">T-Pose</option>
            <option value="sitting">Sitting</option>
        </select>
        <button id="copyBtn">Copy Coordinates</button>
    </div>
    
    <svg id="canvas" width="400" height="500"></svg>
    
    <textarea id="output" readonly></textarea>
</div>

<script>
    // COCO pairs: [0:nose, 1:L_eye, 2:R_eye, 3:L_ear, 4:R_ear, 5:L_shoulder, 6:R_shoulder, 7:L_elbow, 8:R_elbow, 9:L_wrist, 10:R_wrist, 11:L_hip, 12:R_hip, 13:L_knee, 14:R_knee, 15:L_ankle, 16:R_ankle]
    const connections = [[0,1], [0,2], [1,3], [2,4], [5,6], [5,11], [6,12], [11,12], [5,7], [7,9], [6,8], [8,10], [11,13], [13,15], [12,14], [14,16]];
    
    const poses = {
        standing: [
            [200, 50], [190, 40], [210, 40], [175, 45], [225, 45],
            [160, 100], [240, 100], [150, 180], [250, 180], [140, 250], [260, 250],
            [175, 250], [225, 250], [175, 350], [225, 350], [175, 450], [225, 450]
        ],
        tpose: [
            [200, 50], [190, 40], [210, 40], [175, 45], [225, 45],
            [160, 100], [240, 100], [100, 100], [300, 100], [40, 100], [360, 100],
            [175, 250], [225, 250], [175, 350], [225, 350], [175, 450], [225, 450]
        ],
        sitting: [
            [200, 150], [190, 140], [210, 140], [175, 145], [225, 145],
            [160, 200], [240, 200], [160, 270], [240, 270], [160, 320], [240, 320],
            [175, 300], [225, 300], [175, 300], [225, 300], [175, 420], [225, 420]
        ]
    };

    let currentPose = JSON.parse(JSON.stringify(poses.standing));
    let draggedNode = null;

    const svg = document.getElementById('canvas');
    const output = document.getElementById('output');
    const poseSelect = document.getElementById('poseSelect');
    const copyBtn = document.getElementById('copyBtn');

    function render() {
        svg.innerHTML = '';
        
        // Draw connection lines
        connections.forEach(([i, j]) => {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', currentPose[i][0]);
            line.setAttribute('y1', currentPose[i][1]);
            line.setAttribute('x2', currentPose[j][0]);
            line.setAttribute('y2', currentPose[j][1]);
            line.setAttribute('class', 'bone');
            svg.appendChild(line);
        });

        // Draw interactive nodes
        currentPose.forEach((pos, i) => {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', pos[0]);
            circle.setAttribute('cy', pos[1]);
            circle.setAttribute('r', 8);
            circle.setAttribute('class', 'node');
            
            circle.addEventListener('mousedown', () => { draggedNode = i; });
            svg.appendChild(circle);
        });

        // Update coordinate array output
        output.value = JSON.stringify(currentPose);
    }

    // Handle drag movement
    svg.addEventListener('mousemove', (e) => {
        if (draggedNode !== null) {
            const rect = svg.getBoundingClientRect();
            currentPose[draggedNode][0] = Math.max(0, Math.min(400, Math.round(e.clientX - rect.left)));
            currentPose[draggedNode][1] = Math.max(0, Math.min(500, Math.round(e.clientY - rect.top)));
            render();
        }
    });

    // Stop dragging
    window.addEventListener('mouseup', () => { draggedNode = null; });
    svg.addEventListener('mouseleave', () => { draggedNode = null; });

    // Handle pose change
    poseSelect.addEventListener('change', (e) => {
        currentPose = JSON.parse(JSON.stringify(poses[e.target.value]));
        render();
    });

    // Handle copy
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(output.value).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = 'Copied!';
            copyBtn.style.background = '#059669';
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.background = '#10b981';
            }, 2000);
        });
    });

    // Initial render
    render();
</script>
</body>
</html>
